[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hanzi-ocr"
version = "0.0.3"

dependencies = [
    "numpy",
    "torch",
    "pandas",
    "pillow",
    "fonttools",
    "datasets",
    "opencc",
    "matplotlib>=3.7.5",
    "scikit-learn>=1.9.1",
    "albumentations>=1.4.18",
    "torchmetrics>=1.5.2",
    "opencv-python>=5.0.0.93",
]

requires-python = ">= 3.12"
description = "An OCR project for Chinese characters (Hanzi)"
readme = "README.md"

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "pytest",
]
