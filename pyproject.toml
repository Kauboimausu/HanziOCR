[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hanzi-ocr"
version = "0.0.3"

dependencies = [
    "numpy",
    "pandas",
    "pillow",
    "fonttools",
    "opencc",
    "opencv-python-headless",
    "scikit-learn>=1.9.1",
    "albumentations>=1.4.18",
    "torchmetrics>=1.5.2",
    "boto3>=1.43.114",
    "fastapi>=0.155.0",
    "uvicorn>=0.54.0",
    "python-multipart>=0.0.32",
]

requires-python = ">= 3.12"
description = "An OCR project for Chinese characters (Hanzi)"
readme = "README.md"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "jupyter>=1.1.1",
    "matplotlib>=3.7.5",
    "datasets",
    "pytest",
]

# Torch comes from one of these groups, never both. "cpu" is the default and works
# everywhere, "rocm" builds against an AMD GPU:
#     uv sync                              # CPU
#     uv sync --no-group cpu --group rocm  # AMD GPU
cpu = ["torch"]
rocm = ["torch", "pytorch-triton-rocm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]

[tool.uv]
conflicts = [[{ group = "cpu" }, { group = "rocm" }]]
# "cpu" is listed here so a plain 'uv sync' installs the CPU torch instead of resolving
# one from PyPI, which would drag in the CUDA wheels this project never needs
default-groups = ["dev", "cpu"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm6.4"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", group = "cpu" },
    { index = "pytorch-rocm", group = "rocm" },
]
pytorch-triton-rocm = [{ index = "pytorch-rocm", group = "rocm" }]

